x;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--g))}.log{height:140px;overflow:auto;background:#06101c;border-radius:8px;padding:8px;font:11px ui-monospace,monospace}.log div{padding:2px 0;border-bottom:1px solid #ffffff08}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #29415a;text-align:left;font-size:12px}input,select{background:#081624;color:var(--t);border:1px solid #355470;border-radius:7px;padding:7px;max-width:100%}.scene{height:260px;border-radius:12px;position:relative;overflow:hidden;background:linear-gradient(#163b5a,#0b1727 72%);border:1px solid #406581}.city{position:absolute;bottom:0;left:0;right:0;height:75px;background:#0c1a2b}.tower,.tower2,.factory{position:absolute;bottom:48px;background:#294968;border:4px solid #07111f}.tower{left:11%;width:22%;height:125px}.tower2{right:13%;width:27%;height:155px;background:#203d5a}.factory{left:40%;width:28%;height:83px;background:#3b5265}.window{display:inline-block;width:16px;height:16px;background:#75d5ee;margin:7px;box-shadow:0 0 8px #75d5ee}.toast{position:fixed;right:15px;bottom:15px;display:none;background:#162d46;border:1px solid #5d87a8;padding:10px 13px;border-radius:9px;z-index:9}.notice{border-left:3px solid var(--y);padding:8px 10px;background:#332913;border-radius:5px}@media(max-width:1100px){.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:800px){.app{display:block}aside{height:auto;position:relative;border-right:0;border-bottom:1px solid var(--line)}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:7px 3px;font-size:11px}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:11px}.scene{height:210px}}
</style></head><body><div class="app"><aside><div class="brand">Modren Empire</div><div class="muted">Technology Company Management</div><div class="nav" id="nav"></div><hr style="border-color:#243b55;margin:14px 0"><div class="muted">Game Director</div><b>MOLHAM WAHEED</b><div class="muted">Virtual economy • offline-first • Android LAN</div><div class="notice" style="margin-top:12px;font-size:12px">All money and currencies are virtual in-game values. No real banking is connected.</div></aside><main class="main"><div class="top"><div><h1 id="title">Company</h1><div class="muted">Build a technology empire from a small startup.</div></div><div class="row"><button onclick="month()">⏩ Next month</button><button onclick="save()">💾 Save</button><button class="danger" onclick="reset()">↻ New game</button></div></div><div class="stats" id="stats"></div><div id="content"></div><div class="card" style="margin-top:10px"><b>Activity log</b><div class="log" id="log"></div></div></main></div><div class="toast" id="toast"></div>
<script>'use strict';
const KEY='MODREN_EMPIRE_SAVE_V3',ADMIN='MOLHAM WAHEED';const defs={cpu:['CPU',5000,[]],gpu:['GPU',6500,['cpu']],npu:['NPU',7000,['cpu']],ram:['RAM',4500,[]],storage:['Storage',4200,[]],display:['Display',5200,[]],camera:['Camera',6000,['display','software']],battery:['Battery',4800,[]],charging:['Charging',4500,['battery']],connectivity:['4G/5G + Wi-Fi',8000,['cpu']],bluetooth:['Bluetooth + Sensors',3500,['connectivity']],cooling:['Cooling',5500,['cpu']],materials:['Materials',9000,['cooling']],build:['Build quality',7000,['materials']],os:['Operating system',12000,['cpu','software']],software:['Software features',7000,['os']]};
function fresh(){return{schema:3,company:{name:'Modren Technologies',cash:100000,debt:0,revenue:0,expenses:0,rep:50,month:1,year:1,level:1,xp:0},product:{name:'Modren One',price:699,quality:52,appeal:50,power:45,inventory:0,made:0,sold:0,components:Object.fromEntries(Object.keys(defs).map(k=>[k,1]))},research:Object.fromEntries(Object.keys(defs).map(k=>[k,0])),employees:[['Maya','Engineer',65,4200,80],['Omar','Designer',60,3600,82],['Lina','Manager',55,3900,78]].map((x,i)=>({id:i+1,name:x[0],role:x[1],skill:x[2],salary:x[3],morale:x[4],exp:0})),factories:[{id:1,name:'Main Plant',level:1,capacity:50,efficiency:65,quality:60,queue:[]}],suppliers:[{id:1,name:'Nova Silicon',type:'Chip',reliability:88,price:120,contract:12},{id:2,name:'VisionGlass',type:'Display',reliability:84,price:85,contract:12},{id:3,name:'PowerCell',type:'Battery',reliability:90,price:55,contract:12}],markets:[{id:'SY',name:'Syria',demand:1,preference:'Value',unlocked:true,share:3,priceMod:.75},{id:'DE',name:'Germany',demand:1.2,preference:'Quality',unlocked:false,share:0,priceMod:1},{id:'FR',name:'France',demand:1.1,preference:'Design',unlocked:false,share:0,priceMod:.98},{id:'US',name:'USA',demand:1.4,preference:'Performance',unlocked:false,share:0,priceMod:1.08}],competitors:[{name:'Nova Mobile',strategy:'Value',cash:300000,quality:60,price:649,share:28},{name:'Vertex',strategy:'Premium',cash:450000,quality:68,price:799,share:32},{name:'Orion Tech',strategy:'Volume',cash:220000,quality:55,price:599,share:20}],campaigns:[],events:[],projects:[],patents:[],investments:[],settings:{autosave:true,sound:true},bank:{provider:'LOCAL_VIRTUAL_BANK',accounts:[{id:'company-main',currency:'MECR',balance:0}],transactions:[],nextId:1,currencies:{MECR:{name:'Modren Credit',decimals:2},MECOIN:{name:'Modren Coin',decimals:8}}},admin:{name:ADMIN,role:'GAME_DIRECTOR'},lan:{role:'offline',connected:false,host:false,ip:'',lastSync:0},log:['Company founded. All systems are connected to the monthly simulation.']}}
let G=fresh(),page='company';const navs=[['company','🏢 Company'],['products','📱 Products'],['research','🔬 R&D'],['factory','🏭 Factory'],['supply','🚚 Supply'],['staff','👥 Employees'],['market','🌍 Markets'],['marketing','📣 Marketing'],['finance','💰 Finance'],['competitors','🤖 Competitors'],['bank','🏦 Bank layer'],['lan','📡 LAN co-op'],['events','🎲 Events'],['admin','👑 Director'],['settings','⚙️ Settings'],['about','ℹ️ About']];function money(n){return'$'+Math.round(Number(n)||0).toLocaleString()}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',1800)}function log(x){G.log.unshift('[Y'+G.company.year+' M'+G.company.month+'] '+x);G.log=G.log.slice(0,120)}function nav(p){page=p;render()}function spend(n){if(G.company.cash<n){toast('Not enough company cash');return false}G.company.cash-=n;G.company.expenses+=n;return true}function save(){localStorage.setItem(KEY,JSON.stringify(G));toast('Saved validated schema '+G.schema)}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.schema===3)G=x}catch(e){}render()}function reset(){if(confirm('Start a new company?')){G=fresh();save();render()}}function cost(k){return Math.round(defs[k][1]*Math.pow(1.38,G.research[k]))}function doResearch(k){if(defs[k][2].some(x=>!G.research[x]))return toast('Research prerequisites are missing');if(!spend(cost(k)))return;G.research[k]++;G.company.xp+=25;log('Research completed: '+defs[k][0]+' Lv '+G.research[k]);render()}function apply(k){if(G.research[k]<=G.product.components[k])return toast('Research a higher level first');G.product.components[k]++;G.product.quality=Math.min(100,G.product.quality+2);G.product.power=Math.min(100,G.product.power+1);log('Applied '+defs[k][0]+' technology');render()}function develop(){if(!spend(15000+G.projects.length*7000))return;let score=G.product.quality+G.product.appeal+Object.values(G.product.components).reduce((a,b)=>a+b,0)*2;G.projects.push({name:G.product.name+' Gen '+(G.projects.length+2),score});G.product.quality=Math.min(100,G.product.quality+3);G.product.appeal=Math.min(100,G.product.appeal+2);log('New generation developed, score '+score);render()}function hire(role){let skill=45+Math.floor(Math.random()*51),sal=2400+skill*38,n=['Adam','Nour','Sami','Sara','Yara','Hadi','Mira'][Math.floor(Math.random()*7)];if(!spend(sal*2))return;G.employees.push({id:Date.now(),name:n,role,skill,salary:sal,morale:75,exp:0});log('Hired '+n+' as '+role);render()}function train(i){if(!spend(3000))return;G.employees[i].skill=Math.min(100,G.employees[i].skill+3);G.employees[i].morale=Math.min(100,G.employees[i].morale+4);log('Training completed for '+G.employees[i].name);render()}function make(i){let f=G.factories[i],q=Math.min(f.capacity,Math.max(10,f.queue[0]?.qty||f.capacity)),unit=90+Math.max(0,100-f.efficiency)+Math.max(0,75-G.suppliers.reduce((a,s)=>a+s.reliability,0)/G.suppliers.length);if(!spend(q*unit))return;let n=Math.max(1,Math.floor(q*f.efficiency/100));G.product.inventory+=n;G.product.made+=n;f.queue.shift();log('Manufactured '+n+' phones at '+f.name);render()}function upgrade(i){let f=G.factories[i];if(!spend(25000*f.level))return;f.level++;f.capacity+=25;f.efficiency=Math.min(98,f.efficiency+5);f.quality=Math.min(100,f.quality+4);log(f.name+' upgraded to level '+f.level);render()}function addFactory(){if(!spend(80000))return;G.factories.push({id:Date.now(),name:'Expansion Plant '+G.factories.length,level:1,capacity:40,efficiency:55,quality:55,queue:[]});log('New factory commissioned');render()}function supplier(){let n=['Atlas Components','Baltic Chips','Quantum Glass','BlueCell'][Math.floor(Math.random()*4)];G.suppliers.push({id:Date.now(),name:n,type:'Components',reliability:70+Math.floor(Math.random()*25),price:60+Math.floor(Math.random()*90),contract:6});log('Procurement found '+n);render()}function contract(i){let s=G.suppliers[i];if(!spend(s.price*10))return;s.contract+=6;s.reliability=Math.min(99,s.reliability+2);log('Contract extended: '+s.name);render()}function market(id){let m=G.markets.find(x=>x.id===id);if(m.unlocked)return;if(!spend(25000))return;m.unlocked=true;log('Expanded into '+m.name);render()}function campaign(){if(!spend(12000))return;G.campaigns.push({name:'Campaign '+(G.campaigns.length+1),impact:6});G.company.rep=Math.min(100,G.company.rep+6);log('Marketing campaign launched');render()}function loan(){G.company.cash+=50000;G.company.debt+=60000;log('Emergency credit: $50,000 cash / $60,000 liability');render()}function invest(){if(!spend(30000))return;G.investments.push({name:'R&D partner fund',balance:32400});log('Strategic investment opened');render()}function patent(){if(!spend(18000))return;G.patents.push({name:'Modren Patent #'+(G.patents.length+1)});log('Patent registered');render()}function bank(type){let n=Number(document.getElementById('bankAmt')?.value),a=G.bank.accounts[0];if(!Number.isFinite(n)||n<=0)return toast('Enter a valid amount');if(type==='deposit'){if(!spend(n))return;a.balance+=n}else if(type==='withdraw'){if(a.balance<n)return toast('Insufficient ledger balance');a.balance-=n;G.company.cash+=n}else{if(a.balance<n)return toast('Insufficient ledger balance');a.balance-=n}G.bank.transactions.unshift({id:'TX-'+String(G.bank.nextId++).padStart(6,'0'),type,amount:n,currency:'MECR',month:G.company.month,validated:true});log('Ledger '+type+': '+money(n)+' MECR');render()}function director(a){if(a==='cash'){G.company.cash+=1000000;log('DIRECTOR: +$1,000,000')}if(a==='rep')G.company.rep=100;if(a==='research')Object.keys(G.research).forEach(k=>G.research[k]++);if(a==='unlock')G.markets.forEach(m=>m.unlocked=true);if(a==='quality')G.product.quality=100;render()}function event(){let es=[['Supply shortage','cash',-7000],['Viral review','rep',8],['Component breakthrough','quality',5],['Market downturn','rep',-10],['Government incentive','cash',12000],['Battery recall','quality',-6]],e=es[Math.floor(Math.random()*es.length)];if(e[1]==='cash')G.company.cash=Math.max(0,G.company.cash+e[2]);if(e[1]==='rep')G.company.rep=Math.max(0,Math.min(100,G.company.rep+e[2]));if(e[1]==='quality')G.product.quality=Math.max(0,Math.min(100,G.product.quality+e[2]));G.events.unshift({month:G.company.month,name:e[0],impact:e[2]});log('Dynamic event: '+e[0])}function month(){let salaries=G.employees.reduce((a,e)=>a+e.salary,0),upkeep=G.factories.reduce((a,f)=>a+2200+f.capacity*24,0);G.company.cash-=salaries+upkeep;G.company.expenses+=salaries+upkeep;G.company.month++;if(G.company.month>12){G.company.month=1;G.company.year++}let sold=Math.min(G.product.inventory,Math.max(1,Math.floor((G.product.quality+G.product.appeal+G.company.rep)/12))*G.markets.filter(m=>m.unlocked).length),avg=G.markets.filter(m=>m.unlocked).reduce((a,m)=>a+m.priceMod,0)/Math.max(1,G.markets.filter(m=>m.unlocked).length);if(sold){let rev=Math.round(sold*G.product.price*avg);G.product.inventory-=sold;G.product.sold+=sold;G.company.cash+=rev;G.company.revenue+=rev;log('Sales: '+sold+' units / '+money(rev))}G.competitors.forEach(c=>{c.cash+=Math.round(c.share*120);if(Math.random()<.2)c.quality=Math.min(100,c.quality+1)});G.investments.forEach(i=>i.balance=Math.round(i.balance*1.08));if(Math.random()<.42)event();G.employees.forEach(e=>{e.exp++;e.morale=Math.max(35,Math.min(100,e.morale+(e.morale<60?3:-1)))});G.company.xp+=10;if(G.company.xp>=G.company.level*100){G.company.xp=0;G.company.level++;log('Company reached level '+G.company.level)}if(G.settings.autosave)save();broadcast();render()}function exportSave(){let b=new Blob([JSON.stringify(G,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='modren-empire-save-v3.json';a.click();URL.revokeObjectURL(a.href)}function importSave(){document.getElementById('file').click()}function readSave(i){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.schema!==3||!x.company||!x.product)return toast('Invalid save schema');G=x;save();render();toast('Save imported and validated')}catch(e){toast('Invalid JSON save')}};r.readAsText(i.files[0])}function host(){if(!window.ModrenLAN)return toast('Use the Android build for native LAN');G.lan.ip=ModrenLAN.startHost();G.lan.host=true;G.lan.role='host';G.lan.connected=true;toast('Host: '+G.lan.ip);broadcast()}function join(){let ip=document.getElementById('lanIp').value.trim();if(!window.ModrenLAN||!ModrenLAN.connect(ip))return toast('Connection failed');G.lan.role='client';G.lan.connected=true;toast('Connected');ModrenLAN.send(JSON.stringify({type:'request_state'}))}function broadcast(){try{if(window.ModrenLAN&&G.lan.connected)ModrenLAN.send(JSON.stringify({type:'state',schema:3,payload:G}))}catch(e){}}function poll(){try{if(!window.ModrenLAN)return;JSON.parse(ModrenLAN.poll()).forEach(x=>{let m=JSON.parse(x);if(m.type==='request_state'&&G.lan.host)broadcast();if(m.type==='state'&&m.payload&&G.lan.role==='client'&&m.payload.schema===3){let old=G.lan;G=m.payload;G.lan=Object.assign(G.lan||{},old,{lastSync:Date.now()});render()}})}catch(e){}}
function render(){document.getElementById('nav').innerHTML=navs.map(n=>'<button class="'+(n[0]==='admin'?'admin':'')+'" onclick="nav(\''+n[0]+'\')">'+n[1]+'</button>').join('');let c=G.company,total=G.factories.reduce((a,f)=>a+f.capacity,0),a=G.bank.accounts[0].balance;document.getElementById('stats').innerHTML=[['💵 Cash',money(c.cash)],['🏦 Ledger',money(a)],['⭐ Reputation',c.rep+'/100'],['👥 Staff',G.employees.length],['🏭 Capacity',total],['📦 Inventory',G.product.inventory],['📅 Y'+c.year+' M'+c.month]].map(x=>'<div class="card stat"><span class="muted">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');document.getElementById('log').innerHTML=G.log.map(x=>'<div>'+esc(x)+'</div>').join('');document.getElementById('title').textContent=(navs.find(n=>n[0]===page)||['','Company'])[1].replace(/^\S+ /,'');let h='';if(page==='company')h='<div class="grid"><div class="card wide"><div class="scene"><div class="tower">'+('<span class="window"></span>').repeat(8)+'</div><div class="tower2">'+('<span class="window"></span>').repeat(12)+'</div><div class="factory">'+('<span class="window"></span>').repeat(6)+'</div><div class="city"></div></div></div><div class="card"><h3>'+esc(c.name)+'</h3><p>Level '+c.level+' • XP '+c.xp+'/'+c.level*100+'</p><div class="bar"><i style="width:'+Math.min(100,c.xp/(c.level*100)*100)+'%"></i></div><p>Revenue '+money(c.revenue)+' • Expenses '+money(c.expenses)+'</p></div><div class="card"><h3>Core loop</h3><p>Research → Design → Supply → Manufacture → Market → Sell → Expand → Compete.</p><span class="tag green">Playable economy</span><span class="tag">Offline first</span></div></div>';if(page==='products')h='<div class="grid"><div class="card wide"><h3>Phone designer</h3><div class="row"><label>Name <input id="pname" value="'+esc(G.product.name)+'"></label><label>Price <input id="pprice" type="number" value="'+G.product.price+'"></label><button onclick="G.product.name=pname.value.trim()||\'Product\';G.product.price=Math.max(99,Number(pprice.value)||99);log(\'Product spec updated\');render()">Apply</button></div><p>Quality '+G.product.quality+'/100 • Appeal '+G.product.appeal+'/100 • Power '+G.product.power+'/100</p>'+Object.keys(defs).map(k=>'<div class="item"><b>'+defs[k][0]+'</b> <span class="tag">Product Lv '+G.product.components[k]+'</span><span class="tag">R&D Lv '+G.research[k]+'</span><button onclick="apply(\''+k+'\')">Apply research</button></div>').join('')+'<button class="ok" onclick="develop()">🚀 Develop next generation</button><button onclick="patent()">📜 Patent</button></div><div class="card"><h3>Generations</h3>'+((G.projects||[]).map(x=>'<div class="item">'+esc(x.name)+' — score '+x.score+'</div>').join('')||'<span class="muted">None yet.</span>')+'</div></div>';if(page==='research')h='<div class="grid">'+Object.keys(defs).map(k=>'<div class="card"><h3>'+defs[k][0]+'</h3><span class="tag">Lv '+G.research[k]+'</span><p class="muted">Cost '+money(cost(k))+' • Requires '+(defs[k][2].join(', ')||'none')+'</p><button '+(defs[k][2].some(x=>!G.research[x])?'disabled':'')+' onclick="doResearch(\''+k+'\')">Research</button></div>').join('')+'</div>';if(page==='factory')h='<div class="grid"><div class="card wide"><button onclick="addFactory()">+ Build factory ($80,000)</button><span class="tag">Total capacity '+total+'</span></div>'+G.factories.map((f,i)=>'<div class="card"><h3>'+esc(f.name)+'</h3><p>Level '+f.level+' • Capacity '+f.capacity+' • Efficiency '+f.efficiency+'%</p><div class="bar"><i style="width:'+f.efficiency+'%"></i></div><button class="ok" onclick="make('+i+')">🏭 Manufacture</button><button onclick="upgrade('+i+')">⬆ Upgrade ('+money(25000*f.level)+')</button></div>').join('')+'</div>';if(page==='supply')h='<div class="card"><h3>Suppliers & contracts</h3><button onclick="supplier()">+ Find supplier</button><table><tr><th>Supplier</th><th>Type</th><th>Reliability</th><th>Price</th><th>Contract</th><th></th></tr>'+G.suppliers.map((s,i)=>'<tr><td>'+esc(s.name)+'</td><td>'+s.type+'</td><td>'+s.reliability+'%</td><td>'+money(s.price)+'</td><td>'+s.contract+' mo</td><td><button onclick="contract('+i+')">Extend</button></td></tr>').join('')+'</table></div>';if(page==='staff')h='<div class="card"><h3>Employees</h3><div class="row">'+['Engineer','Designer','Marketer','Manager','Researcher','Factory worker','Software developer'].map(r=>'<button onclick="hire(\''+r+'\')">+ '+r+'</button>').join('')+'</div><table><tr><th>Name</th><th>Role</th><th>Skill</th><th>Morale</th><th>Salary</th><th></th></tr>'+G.employees.map((e,i)=>'<tr><td>'+esc(e.name)+'</td><td>'+esc(e.role)+'</td><td>'+e.skill+'</td><td>'+e.morale+'</td><td>'+money(e.salary)+'</td><td><button onclick="train('+i+')">Train</button></td></tr>').join('')+'</table></div>';if(page==='market')h='<div class="grid">'+G.markets.map(m=>'<div class="card"><h3>'+m.name+'</h3><span class="tag '+(m.unlocked?'green':'red')+'">'+(m.unlocked?'Unlocked':'Locked')+'</span><p>Demand '+m.demand+'× • Preference '+m.preference+' • Share '+m.share.toFixed(1)+'%</p><button onclick="market(\''+m.id+'\')">'+(m.unlocked?'Open':'Unlock ($25,000)')+'</button></div>').join('')+'<div class="card wide"><p>Inventory '+G.product.inventory+' • Price '+money(G.product.price)+'</p><button class="ok" onclick="month()">Run market cycle</button></div></div>';if(page==='marketing')h='<div class="grid"><div class="card"><h3>Campaigns</h3><button onclick="campaign()">Launch campaign ($12,000)</button>'+G.campaigns.map(x=>'<div class="item">'+x.name+' — +'+x.impact+' reputation</div>').join('')+'</div><div class="card"><h3>Brand reputation</h3><div style="font-size:25px">'+c.rep+'/100</div><div class="bar"><i style="width:'+c.rep+'%"></i></div></div></div>';if(page==='finance')h='<div class="grid"><div class="card"><h3>Finance</h3><p>Cash '+money(c.cash)+' • Debt '+money(c.debt)+'</p><p>Revenue '+money(c.revenue)+' • Expenses '+money(c.expenses)+'</p><button onclick="loan()">Emergency credit</button><button onclick="invest()">Invest ($30,000)</button></div><div class="card"><h3>Investments</h3>'+G.investments.map(i=>'<div class="item">'+i.name+' — '+money(i.balance)+'</div>').join('')+'</div></div>';if(page==='competitors')h='<div class="card"><h3>Competitor intelligence</h3><table><tr><th>Company</th><th>Strategy</th><th>Quality</th><th>Price</th><th>Share</th><th>Cash</th></tr>'+G.competitors.map(x=>'<tr><td>'+x.name+'</td><td>'+x.strategy+'</td><td>'+x.quality+'</td><td>'+money(x.price)+'</td><td>'+x.share+'%</td><td>'+money(x.cash)+'</td></tr>').join('')+'</table></div>';if(page==='bank')h='<div class="grid"><div class="card wide"><h3>Banking abstraction / virtual ledger</h3><span class="tag">Provider: '+G.bank.provider+'</span><span class="tag green">Adapter boundary ready</span><p class="muted">No real money, blockchain, payment or external account is used.</p><div class="row"><input id="bankAmt" type="number" placeholder="Amount"><button onclick="bank(\'deposit\')">Deposit</button><button onclick="bank(\'withdraw\')">Withdraw</button><button onclick="bank(\'transfer\')">Record transfer</button></div></div><div class="card"><h3>MECR balance</h3><div style="font-size:25px">'+money(a)+'</div></div><div class="card"><h3>Validated ledger</h3>'+G.bank.transactions.slice(0,8).map(t=>'<div class="item">'+t.id+' • '+t.type+' • '+money(t.amount)+'</div>').join('')+'</div></div>';if(page==='lan')h='<div class="grid"><div class="card"><h3>Local co-op via hotspot</h3><p>Status: <span class="tag '+(G.lan.connected?'green':'red')+'">'+(G.lan.connected?'Connected':'Offline')+'</span></p><p>Host IP: '+(G.lan.ip||'—')+'</p><div class="row"><button onclick="host()">Create host</button><input id="lanIp" placeholder="Host IP"><button onclick="join()">Join host</button></div><p class="muted">TCP 47777 • authoritative host snapshots • schema validation • reconnect-safe queues.</p></div><div class="card"><h3>Sync</h3><p>Role: '+G.lan.role+' • Last sync: '+(G.lan.lastSync?new Date(G.lan.lastSync).toLocaleTimeString():'—')+'</p><button onclick="broadcast()">Send state snapshot</button></div></div>';if(page==='events')h='<div class="card"><h3>Dynamic events</h3>'+G.events.map(e=>'<div class="item">Y'+e.month+' — '+esc(e.name)+' <span class="tag">impact '+e.impact+'</span></div>').join('')+'</div>';if(page==='admin')h='<div class="grid"><div class="card admin"><h3>👑 GAME DIRECTOR</h3><p><b>'+ADMIN+'</b> — full permissions</p><div class="row"><button onclick="director(\'cash\')">+ $1M</button><button onclick="director(\'rep\')">Max reputation</button><button onclick="director(\'research\')">Boost research</button><button onclick="director(\'unlock\')">Unlock markets</button><button onclick="director(\'quality\')">Max quality</button></div></div><div class="card"><h3>Controls</h3><p>Level '+c.level+' • Y'+c.year+' M'+c.month+'</p><button onclick="c.level++;log(\'DIRECTOR: level increased\');render()">Increase level</button></div><div class="card"><h3>Save tools</h3><button onclick="exportSave()">Export JSON</button><button onclick="importSave()">Import JSON</button><input id="file" type="file" accept=".json" style="display:none" onchange="readSave(this)"></div></div>';if(page==='settings')h='<div class="card"><h3>Settings</h3><p><label><input type="checkbox" '+(G.settings.autosave?'checked':'')+' onchange="G.settings.autosave=this.checked"> Autosave</label></p><p><label><input type="checkbox" '+(G.settings.sound?'checked':'')+' onchange="G.settings.sound=this.checked"> Feedback sound preference</label></p><p class="muted">Android stores local saves in WebView storage. Export/import provides backup and migration validation.</p></div>';if(page==='about')h='<div class="card"><h3>Modren Empire 3.0</h3><p><b>Developer:</b> MOLHAM WAHEED</p><p>A 2D technology-company simulation linking products, OS/R&D, staff, factories, suppliers, markets, competitors, marketing, finance, events, virtual banking, saves and Android hotspot co-op.</p><p class="muted">Real banking and real currency are deliberately not implemented; only the documented integration boundary exists.</p></div>';document.getElementById('content').innerHTML=h}load();setInterval(poll,1000);</script></body></html>
