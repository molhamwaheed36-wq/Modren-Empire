name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Build Modren Empire APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Download Godot and templates
        run: |
          mkdir -p "$RUNNER_TEMP/godot/bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot/godot.zip" https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot/godot.zip" -d "$RUNNER_TEMP/godot/bin"
          GODOT=$(find "$RUNNER_TEMP/godot/bin" -type f -name 'Godot_v4.3-stable_linux.x86_64' | head -1)
          chmod +x "$GODOT"
          echo "$GODOT" > "$RUNNER_TEMP/godot_path.txt"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/godot/templates.tpz" https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -p "$RUNNER_TEMP/godot/templates.tpz" templates/android_debug.apk > "$RUNNER_TEMP/android_debug.apk"
          unzip -p "$RUNNER_TEMP/godot/templates.tpz" templates/linux_debug.x86_64 > "$HOME/.local/share/godot/export_templates/4.3.stable/linux_debug.x86_64"

      - name: Export game pack
        run: |
          GODOT=$(cat "$RUNNER_TEMP/godot_path.txt")
          mkdir -p ModrenEmpire_Godot/build
          "$GODOT" --headless --path ModrenEmpire_Godot --import
          "$GODOT" --headless --path ModrenEmpire_Godot --export-pack "Linux Pack" build/index.android.pck
          test -s ModrenEmpire_Godot/build/index.android.pck

      - name: Build and sign APK
        run: |
          set -e
          rm -rf "$RUNNER_TEMP/apk"
          mkdir -p "$RUNNER_TEMP/apk"
          cd "$RUNNER_TEMP/apk"
          unzip -q "$RUNNER_TEMP/android_debug.apk"
          mkdir -p assets
          cp "$GITHUB_WORKSPACE/ModrenEmpire_Godot/build/index.android.pck" assets/index.android.pck
          zip -q -0 -r "$RUNNER_TEMP/unsigned.apk" .
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/modren-debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -name zipalign | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$ZIPALIGN" -f 4 "$RUNNER_TEMP/unsigned.apk" "$GITHUB_WORKSPACE/ModrenEmpire_Godot/build/ModrenEmpire-debug-unaligned.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/modren-debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$GITHUB_WORKSPACE/ModrenEmpire_Godot/build/ModrenEmpire-debug.apk" "$GITHUB_WORKSPACE/ModrenEmpire_Godot/build/ModrenEmpire-debug-unaligned.apk"
          "$APKSIGNER" verify --verbose ModrenEmpire_Godot/build/ModrenEmpire-debug.apk
          file "$GITHUB_WORKSPACE/ModrenEmpire_Godot/build/ModrenEmpire-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/ModrenEmpire_Godot/build/ModrenEmpire-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: modren-empire-godot-debug-apk
          path: ModrenEmpire_Godot/build/ModrenEmpire-debug.apk
          if-no-files-found: error
