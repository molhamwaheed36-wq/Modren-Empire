name: Build Godot Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    name: Export Modren Empire APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/android_ndk_path = "$ANDROID_HOME/ndk/27.2.12479018"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Export Android APK
        uses: firebelley/godot-export@v7.0.0
        id: export
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ModrenEmpire_Godot
          presets_to_export: Android
          export_debug: true
          use_preset_export_path: true
          cache: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: modren-empire-godot-debug-apk
          path: ModrenEmpire_Godot/build/*.apk
          if-no-files-found: error
